<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>废土大亨 · 布局 C 预览</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ===== 顶栏：紧凑图标按钮 ===== -->
  <header id="top">
    <div>
      <h1><img class="brand-mark" src="assets/ui/brand.webp" alt="" /> 废土大亨：末世大富翁</h1>
      <div class="sub">WASTELAND TYCOON · 方案 C 预览 · 紧凑顶栏 + 底栏情报流</div>
    </div>
    <div class="top-actions">
      <button class="icon-btn on" title="语音播报">
        <svg viewBox="0 0 16 16"><path d="M8 1L4 5H1v6h3l4 4V1z"/><path d="M11 5c1.5 1 1.5 5 0 6M13 3c3 2 3 8 0 10" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
        播报
      </button>
      <button class="icon-btn" title="系统语音">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
        系统语音
      </button>
      <button class="icon-btn" title="测音">
        <svg viewBox="0 0 16 16"><path d="M2 8h2l2-5 3 10 3-7 2 2h2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        测音
      </button>
      <button class="icon-btn" title="存档">
        <svg viewBox="0 0 16 16"><path d="M2 2h12v12H2zM5 2v5h6V2M6 11h4v3H6z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
        存档
      </button>
      <button class="icon-btn" title="读档">
        <svg viewBox="0 0 16 16"><path d="M3 1h7l3 3v11H3zM5 1v4h5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
        读档
      </button>
      <button class="icon-btn" title="重新开始">
        <svg viewBox="0 0 16 16"><path d="M3 8a5 5 0 1 1 1.5 3.5M3 12v-3h3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        重新开始
      </button>
    </div>
  </header>

  <!-- ===== 主体：棋盘 + 侧栏 ===== -->
  <main id="wrap">
    <!-- 棋盘 -->
    <section id="board">
      <span class="map-corner tl"></span><span class="map-corner tr"></span>
      <span class="map-corner bl"></span><span class="map-corner br"></span>

      <div id="boardScroll">
        <div id="boardInner">
          <!-- 顶行：12 格 -->
          <div class="board-row" id="boardTop"></div>
          <!-- 中段：左列 + 中心 + 右列 -->
          <div class="board-mid">
            <div class="board-col" id="boardLeft"></div>
            <div id="boardCenter">
              <div class="center-label">— 玩家动态视图（占位） —</div>
              <div class="center-label" style="color:var(--amber);font-size:11px">SECTOR 7-G · 回合 12</div>
              <div class="center-label">4 名幸存者 · 目标 3000 盖</div>
              <div class="center-label" style="color:var(--phos)">当前位置：避难所出口 +200</div>
            </div>
            <div class="board-col" id="boardRight"></div>
          </div>
          <!-- 底行：12 格 -->
          <div class="board-row" id="boardBottom"></div>
        </div>
      </div>
    </section>

    <!-- 右侧栏：回合 + 幸存者 + 日志 -->
    <aside id="side">
      <!-- 回合 -->
      <div class="card">
        <h2>// 回合</h2>
        <div class="dice-row">
          <div class="die" id="die1"><span class="dot d3-1"></span><span class="dot d3-3"></span><span class="dot d3-2"></span></div>
          <div class="die" id="die2"><span class="dot d4-1"></span><span class="dot d4-2"></span><span class="dot d4-3"></span><span class="dot d4-4"></span></div>
          <div class="turn-info">
            <div class="who">家甲</div>
            <div>回合 <b style="color:var(--amber)">12</b> · 待掷骰</div>
          </div>
        </div>
        <button class="roll-btn">掷 骰</button>
      </div>

      <!-- 幸存者 -->
      <div class="card">
        <h2>// 幸存者（2 / 4）</h2>
        <div class="players">
          <div class="pl active">
            <div class="pva">家</div>
            <div class="pl-info">
              <div class="pl-name">家甲</div>
              <div class="pl-meta">避难所出口 · 产 0 · 德 0</div>
            </div>
            <div class="pl-cash">1500</div>
          </div>
          <div class="pl">
            <div class="pva" style="color:var(--tech)">玩</div>
            <div class="pl-info">
              <div class="pl-name">玩</div>
              <div class="pl-meta">查理哨 · 产 0 · 德 0</div>
            </div>
            <div class="pl-cash">1500</div>
          </div>
          <div class="pl" style="opacity:.5">
            <div class="pva" style="color:var(--dim)">·</div>
            <div class="pl-info">
              <div class="pl-name" style="color:var(--dim)">空位</div>
              <div class="pl-meta">等待加入…</div>
            </div>
            <div class="pl-cash" style="color:var(--dim)">—</div>
          </div>
          <div class="pl" style="opacity:.5">
            <div class="pva" style="color:var(--dim)">·</div>
            <div class="pl-info">
              <div class="pl-name" style="color:var(--dim)">空位</div>
              <div class="pl-meta">等待加入…</div>
            </div>
            <div class="pl-cash" style="color:var(--dim)">—</div>
          </div>
        </div>
      </div>

      <!-- 行动日志 -->
      <div class="card" style="flex:1;display:flex;flex-direction:column;min-height:0;">
        <h2>// 行动日志</h2>
        <div class="log" id="logBox"></div>
      </div>
    </aside>
  </main>

  <!-- ===== 底部情报条：横向滚动卡片流 ===== -->
  <footer id="bottom">
    <div class="intel-head">
      <h2>// 情报</h2>
      <div class="tabs" id="intelTabs">
        <div class="tab on" data-cat="all">全部</div>
        <div class="tab" data-cat="cash">资金</div>
        <div class="tab" data-cat="prop">产权</div>
        <div class="tab" data-cat="build">建造</div>
        <div class="tab" data-cat="event">事件</div>
        <div class="tab" data-cat="bounty">悬赏</div>
        <div class="tab" data-cat="explore">探索</div>
        <div class="tab" data-cat="system">系统</div>
      </div>
    </div>
    <div class="intel-flow" id="intelFlow"></div>
  </footer>

  <script src="js/preview.js"></script>
</body>
</html>
