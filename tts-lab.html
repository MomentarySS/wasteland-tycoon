<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地 TTS 试听 · WASTELAND TYCOON</title>
<style>
  :root{--bg:#0c0e0d;--panel:#14181a;--line:#2a3133;--ink:#cfe0d2;--dim:#6f7d76;--amber:#c9a227;--phos:#7fae6e;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Courier New",Consolas,monospace;padding:16px;max-width:900px;margin:0 auto;}
  h1{font-size:16px;color:var(--amber);letter-spacing:3px;margin:0 0 4px;}
  .sub{font-size:11px;color:var(--dim);letter-spacing:1px;margin-bottom:14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px;margin-bottom:12px;}
  label{font-size:11px;color:var(--phos);letter-spacing:1px;}
  select,input[type=range],input[type=number],textarea,button{font-family:inherit;}
  select,textarea{background:#0e1213;color:var(--ink);border:1px solid var(--line);border-radius:2px;padding:6px;width:100%;}
  textarea{min-height:72px;font-size:13px;line-height:1.5;resize:vertical;}
  button{background:var(--amber);color:#0c0e0d;border:1px solid #000;padding:8px 14px;border-radius:2px;font-weight:bold;cursor:pointer;letter-spacing:1px;}
  button:disabled{background:#1a1f20;color:#4a5550;cursor:not-allowed;border-color:var(--line);}
  button.alt{background:#11161a;color:var(--ink);border-color:var(--line);}
  button.sm{padding:4px 10px;font-size:11px;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0;}
  .row label{flex:0 0 auto;}
  #log{background:#0a0d0c;border:1px solid var(--line);border-radius:2px;padding:8px;font-size:11px;color:#9fb0a6;min-height:120px;max-height:260px;overflow-y:auto;white-space:pre-wrap;line-height:1.5;}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;}
  th,td{border-bottom:1px dotted #1d2426;padding:4px 6px;text-align:left;color:#aebcb4;}
  th{color:var(--phos);font-weight:normal;letter-spacing:1px;}
  .ok{color:var(--phos);} .warn{color:#d8b13a;} .bad{color:#e0574a;}
  .hint{font-size:11px;color:var(--dim);line-height:1.5;margin-top:4px;}
</style>
</head>
<body>
<h1>本地 TTS 试听 · TTS LAB</h1>
<div class="sub">sherpa-onnx WASM · 离线中文 TTS 选型验证 · 与游戏本体无关</div>

<div class="card">
  <div class="row">
    <label>引擎</label>
    <select id="engine" style="width:auto;flex:1"></select>
    <span id="simd" class="hint"></span>
  </div>
  <div class="row">
    <label>音色 SID</label>
    <input type="number" id="sid" value="0" min="0" style="width:80px">
    <span id="spkInfo" class="hint"></span>
  </div>
  <div class="row">
    <label>语速 <span id="spdVal">1.0</span></label>
    <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1" style="flex:1">
  </div>
  <div class="row" id="presets"></div>
  <textarea id="text">废土大亨：末世大富翁。玩家甲掷出 11 点，占领了莫诺加矿洞。</textarea>
  <div class="row">
    <button id="genBtn">▶ 生成并播放</button>
    <button id="stopBtn" class="alt" disabled>■ 停止</button>
    <button id="wavBtn" class="alt" disabled>⬇ 导出 WAV</button>
    <button id="initBtn" class="alt">① 初始化引擎</button>
  </div>
  <div class="hint">首次初始化会加载 WASM 与打包模型（.data，可能上百 MB，看下方日志进度）；生成完成后自动播放。RTF &lt; 1 表示快于实时。</div>
</div>

<div class="card">
  <h2 style="font-size:12px;color:var(--amber);letter-spacing:2px;margin:0 0 6px">// 生成数据</h2>
  <table id="rtTable">
    <thead><tr><th>#</th><th>字符数</th><th>生成耗时</th><th>音频时长</th><th>RTF</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<div class="card">
  <h2 style="font-size:12px;color:var(--amber);letter-spacing:2px;margin:0 0 6px">// 日志</h2>
  <div id="log"></div>
</div>

<script type="module" src="js/tts-lab.js"></script>
</body>
</html>
